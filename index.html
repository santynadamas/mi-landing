<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi landing page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    background: #6b0f2a;
    color: #f4efe6;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(1.25rem, 6vw, 5rem);
    padding-top: max(clamp(1.25rem, 6vw, 5rem), env(safe-area-inset-top));
    padding-bottom: max(clamp(1.25rem, 6vw, 5rem), env(safe-area-inset-bottom));
    overflow-x: hidden;
  }

  main {
    width: 100%;
    max-width: 1400px;
    margin-inline: auto;
  }

  h1 {
    font-stretch: 125%;
    font-weight: 900;
    font-size: clamp(2.2rem, 10.5vw, 10rem);
    line-height: 0.95;
    letter-spacing: -0.035em;
    overflow-wrap: break-word;
    hyphens: auto;
    text-shadow:
      0 2px 0 rgba(0, 0, 0, 0.15),
      0 8px 24px rgba(0, 0, 0, 0.35),
      0 20px 60px rgba(0, 0, 0, 0.30);
  }

  p {
    margin-top: clamp(1rem, 3vw, 1.75rem);
    font-size: clamp(1rem, 2.5vw, 1.5rem);
    max-width: 40ch;
    line-height: 1.5;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
  }

  @media (max-width: 600px) {
    h1 {
      font-stretch: 100%;
      font-size: clamp(2.2rem, 13vw, 4.5rem);
    }
  }

  @media (max-height: 500px) and (orientation: landscape) {
    h1 { font-size: clamp(1.8rem, 8vw, 4rem); }
    p  { margin-top: 0.75rem; }
  }

  @media (min-width: 1600px) {
    h1 { font-size: 11rem; }
  }
</style>
</head>
<body>
  <main>
    <h1>Hola Mundo!</h1>
    <p>Esta es mi primera landing page...</p>
  </main>
</body>
</html>
